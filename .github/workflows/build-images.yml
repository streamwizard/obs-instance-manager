name: Build and push image

# Builds the obs-instance-manager API image and pushes it to GHCR so nodes can
# `docker compose pull` a prebuilt image instead of cloning this repo and
# building on the box (see scripts/install.sh).
#
# The package must be Public for nodes to pull it -- they authenticate to GHCR
# with nothing at all.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/streamwizard/obs-instance-manager:latest
            ghcr.io/streamwizard/obs-instance-manager:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
